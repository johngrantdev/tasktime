version: 2
updates:
  - package-ecosystem: npm
    directories:
      - '/'
      - '/apps/**'
      - '/packages/**'
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
